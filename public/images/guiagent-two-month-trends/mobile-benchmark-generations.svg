<text x="1373.5" y="458" font-size="13.5" fill="#64748b">总体 52、跨应用 37；加无障碍树最高 +26</text>
<rect x="40" y="768" width="1720" height="224" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="64" y="798" font-size="19" font-weight="700" fill="#0f172a">换代真正改变的是五条口径，而不是分数</text>
<text x="230" y="798" font-size="14" fill="#94a3b8">早期</text>
<text x="600" y="798" font-size="14" fill="#94a3b8">当前主战场</text>
<text x="990" y="798" font-size="14" fill="#94a3b8">正在成为默认</text>
<text x="64" y="826" font-size="16" font-weight="600" fill="#334155">任务长度</text>
<text x="230" y="826" font-size="15.5" fill="#94a3b8">十余步的单一意图</text>
<text x="560" y="826" font-size="15" fill="#cbd5e1">→</text>
<text x="600" y="826" font-size="15.5" fill="#d97706">平均 27.8 步</text>
<text x="955" y="826" font-size="15" fill="#cbd5e1">→</text>
<text x="990" y="826" font-size="15.5" fill="#1e293b">26 步以上的长程工作流</text>
<text x="64" y="862" font-size="16" font-weight="600" fill="#334155">跨应用比例</text>
<text x="230" y="862" font-size="15.5" fill="#94a3b8">AndroidWorld 仅 9.5%</text>
<text x="560" y="862" font-size="15" fill="#cbd5e1">→</text>
<text x="600" y="862" font-size="15.5" fill="#d97706">MobileWorld 62.2%</text>
<text x="955" y="862" font-size="15" fill="#cbd5e1">→</text>
<text x="990" y="862" font-size="15.5" fill="#1e293b">跨应用成为默认而非特例</text>
<text x="64" y="898" font-size="16" font-weight="600" fill="#334155">运行载体</text>
<text x="230" y="898" font-size="15.5" fill="#94a3b8">模拟器</text>
<text x="560" y="898" font-size="15" fill="#cbd5e1">→</text>
<text x="600" y="898" font-size="15.5" fill="#d97706">真机集群（100 台以上）</text>
<text x="955" y="898" font-size="15" fill="#cbd5e1">→</text>
<text x="990" y="898" font-size="15.5" fill="#1e293b">设备、账号、地区、版本漂移进入评测</text>
<text x="64" y="934" font-size="16" font-weight="600" fill="#334155">应用来源</text>
<text x="230" y="934" font-size="15.5" fill="#94a3b8">开源可插桩 App</text>
<text x="560" y="934" font-size="15" fill="#cbd5e1">→</text>
<text x="600" y="934" font-size="15.5" fill="#d97706">94 个闭源高频 App</text>
<text x="955" y="934" font-size="15" fill="#cbd5e1">→</text>
<text x="990" y="934" font-size="15.5" fill="#1e293b">拿不到内部状态，只能靠外部可观察证据</text>
<text x="64" y="970" font-size="16" font-weight="600" fill="#334155">判定方式</text>
<text x="230" y="970" font-size="15.5" fill="#94a3b8">终态快照判分</text>
<text x="560" y="970" font-size="15" fill="#cbd5e1">→</text>
<text x="600" y="970" font-size="15.5" fill="#d97706">后端数据库直查</text>
<text x="955" y="970" font-size="15" fill="#cbd5e1">→</text>
<text x="990" y="970" font-size="15.5" fill="#1e293b">过程 guideline 判定（与人工一致 87.37%）</text>
<rect x="40" y="1018" width="1720" height="118" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.8"/>
<rect x="40" y="1018" width="7" height="118" rx="3" fill="#dc2626"/>
<text x="64" y="1048" font-size="17" font-weight="700" fill="#b91c1c">读移动端分数前必须知道的三件事</text>
<text x="64" y="1076" font-size="15.5" fill="#7f1d1d">一、AndroidWorld 榜单首行自带「无独立验证、自报、后果自负」声明；可复现的 GUI 基线在统一环境里只有 57.8 到 69.3。</text>
<text x="64" y="1100" font-size="15.5" fill="#7f1d1d">二、纯命令行的 Claude Code 未做任何移动端后训练就拿到 71.8，人工写的 oracle 命令行能到 88.8（116 题里 103 题可纯 CLI 解）——榜单在相当程度上测的是「会不会绕开界面」。</text>
<text x="64" y="1124" font-size="15.5" fill="#7f1d1d">三、同一个名字可能指不同东西：AndroidDaily 在不同论文里有三套互不相容的描述，MobileWorld / GUI-only 子集 / MobileWorld-Real 是三套任务，引用前须对齐任务数与判定协议。</text>
<text x="40" y="1156" font-size="15.5" fill="#94a3b8">官方榜数字取自各榜单底层数据文件，论文数字取自各论文自述对比表；「第一代/第四代」为本文按饱和度与替代关系的归类，非官方划分。</text>
</svg>