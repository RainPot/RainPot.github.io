<text x="900" y="54" font-size="31" font-weight="700" fill="#0f172a" text-anchor="middle">移动端 GUI Agent 榜单的四次换代（截至 2026-08-20）</text>
<text x="900" y="90" font-size="18" fill="#64748b" text-anchor="middle">移动端换代速度是全场最快的：一套基准从发布到饱和大约 12 到 18 个月，被替换的原因不是任务不够多，而是任务不够长、跨应用不够多、判定不够细</text>
<text x="900" y="118" font-size="16" fill="#94a3b8" text-anchor="middle">分数为该基准已知最好成绩；移动端自报比例是各平台里最高的，标注「自报」者未经第三方复现</text>
