<text x="935.0" y="588" font-size="13.5" fill="#64748b">前者为自报，后者为论文自测</text>
<rect x="1355.5" y="152" width="404.5" height="54" rx="10" fill="#dc2626"/>
<text x="1557.8" y="175" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">第四代 · 长程与跨系统</text>
<text x="1557.8" y="196" font-size="15" fill="#ffffff" fill-opacity="0.88" text-anchor="middle">远未解决</text>
<rect x="1355.5" y="222" width="404.5" height="116" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1.8"/>
