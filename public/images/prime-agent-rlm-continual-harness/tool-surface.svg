<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1800" height="980" fill="#f8fafc"/>
  <text x="900" y="50" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">工具面:给模型 N 个工具,还是给它 1 个工具加一门语言</text>
  <text x="900" y="84" font-size="18" fill="#64748b" text-anchor="middle">Prime Agent 的默认工具集在源码里就一个词:selectedTools ?? ["ipython"]</text>

  <!-- LEFT -->
  <rect x="40" y="116" width="830" height="826" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="116" width="830" height="54" rx="14" fill="#f1f5f9"/>
  <rect x="40" y="156" width="830" height="14" fill="#f1f5f9"/>
  <text x="68" y="151" font-size="21" font-weight="700" fill="#334155">A. 常见做法:每种能力一个 tool schema</text>

  <text x="72" y="200" font-size="16" font-weight="600" fill="#475569">每一轮请求都要把这些 schema 发给模型</text>

  <g font-size="15" font-family="Menlo, DejaVu Sans Mono, monospace">
    <rect x="72" y="216" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="156" y="241" fill="#1d4ed8" text-anchor="middle">read_file</text>
    <rect x="252" y="216" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="336" y="241" fill="#1d4ed8" text-anchor="middle">write_file</text>
    <rect x="432" y="216" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="516" y="241" fill="#1d4ed8" text-anchor="middle">edit_file</text>
    <rect x="612" y="216" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="696" y="241" fill="#1d4ed8" text-anchor="middle">bash</text>

    <rect x="72" y="264" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="156" y="289" fill="#1d4ed8" text-anchor="middle">glob</text>
    <rect x="252" y="264" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="336" y="289" fill="#1d4ed8" text-anchor="middle">grep</text>
    <rect x="432" y="264" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="516" y="289" fill="#1d4ed8" text-anchor="middle">web_search</text>
    <rect x="612" y="264" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="696" y="289" fill="#1d4ed8" text-anchor="middle">web_fetch</text>

    <rect x="72" y="312" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="156" y="337" fill="#1d4ed8" text-anchor="middle">todo_write</text>
    <rect x="252" y="312" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="336" y="337" fill="#1d4ed8" text-anchor="middle">task</text>
    <rect x="432" y="312" width="168" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="516" y="337" fill="#1d4ed8" text-anchor="middle">notebook_edit</text>
    <rect x="612" y="312" width="168" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="696" y="337" fill="#94a3b8" text-anchor="middle">…</text>
  </g>

  <rect x="72" y="374" width="766" height="150" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="92" y="404" font-size="17" font-weight="600" fill="#9a3412">再接一个 MCP server</text>
  <g font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace">
    <rect x="92" y="418" width="226" height="34" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="205" y="441" fill="#9a3412" text-anchor="middle">mcp__linear__list_issues</text>
    <rect x="330" y="418" width="226" height="34" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="443" y="441" fill="#9a3412" text-anchor="middle">mcp__linear__get_issue</text>
    <rect x="568" y="418" width="226" height="34" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="681" y="441" fill="#9a3412" text-anchor="middle">mcp__linear__create_…</text>
    <rect x="92" y="460" width="226" height="34" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="205" y="483" fill="#9a3412" text-anchor="middle">mcp__linear__update_…</text>
    <rect x="330" y="460" width="226" height="34" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="443" y="483" fill="#9a3412" text-anchor="middle">mcp__linear__search_…</text>
    <rect x="568" y="460" width="226" height="34" rx="7" fill="#fef3c7" stroke="#fdba74"/><text x="681" y="483" fill="#92400e" text-anchor="middle">…还有十几个</text>
  </g>
  <text x="92" y="513" font-size="15" fill="#94a3b8">一个服务接进来,工具面就整体膨胀一圈</text>

  <rect x="72" y="546" width="766" height="176" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="92" y="578" font-size="17" font-weight="600" fill="#334155">这样做的两个代价</text>
  <text x="92" y="610" font-size="16" fill="#475569">1. schema 自己就占上下文,而且每轮都在</text>
  <text x="92" y="640" font-size="16" fill="#475569">2. 工具一多,模型挑错工具、填错参数的概率跟着涨</text>
  <text x="92" y="676" font-size="15.5" fill="#94a3b8">更别扭的是组合:想把 grep 的结果喂给 web_fetch,</text>
  <text x="92" y="702" font-size="15.5" fill="#94a3b8">中间结果必须先原样经过一次上下文,模型才能接着用。</text>

  <rect x="72" y="744" width="766" height="88" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="92" y="776" font-size="16" font-weight="600" fill="#1e40af">能力的单位 = 一个工具定义</text>
  <text x="92" y="806" font-size="15.5" fill="#475569">加能力就要改 harness 的工具列表,由 harness 作者决定。</text>

  <!-- RIGHT -->
  <rect x="930" y="116" width="830" height="826" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="930" y="116" width="830" height="54" rx="14" fill="#ecfdf5"/>
  <rect x="930" y="156" width="830" height="14" fill="#ecfdf5"/>
  <text x="958" y="151" font-size="21" font-weight="700" fill="#047857">B. Prime Agent:只有一个工具</text>

  <rect x="1180" y="196" width="330" height="62" rx="10" fill="#059669"/>
  <text x="1345" y="235" font-size="24" font-weight="700" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#ffffff" text-anchor="middle">ipython</text>
  <text x="1550" y="234" font-size="15" fill="#94a3b8">← 模型看到的全部工具</text>

  <line x1="1345" y1="258" x2="1345" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="962" y="294" width="766" height="510" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="982" y="324" font-size="18" font-weight="700" fill="#0f766e">能力全都放在 IPython 内核的命名空间里</text>

  <text x="982" y="358" font-size="15" font-weight="600" fill="#475569">预装的第三方包(启动时就装好)</text>
  <g font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#0f766e">
    <text x="982" y="384">requests · httpx · pandas · numpy · scipy · bs4 · lxml</text>
    <text x="982" y="408">pydantic · yaml · tomli · dotenv · tyro</text>
  </g>
  <text x="982" y="434" font-size="14" fill="#94a3b8">不够就 `uv pip install &lt;pkg&gt;` 自己装</text>

  <line x1="982" y1="452" x2="1708" y2="452" stroke="#99f6e4"/>

  <text x="982" y="480" font-size="15" font-weight="600" fill="#475569">预导入的 skill 模块(仓库里 13 个,带 Python 包的直接当函数调)</text>
  <g font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#0f766e">
    <text x="982" y="506">edit · goal · agent_message · agent_observe · websearch</text>
    <text x="982" y="530">compact · refine · rlm_heartbeat · attach_image · linear · notion</text>
  </g>
  <text x="982" y="556" font-size="14" fill="#94a3b8">调用长这样:await edit(path="pkg/f.py", old_str=..., new_str=...)</text>

  <line x1="982" y1="574" x2="1708" y2="574" stroke="#99f6e4"/>

  <text x="982" y="602" font-size="15" font-weight="600" fill="#475569">递归子智能体</text>
  <text x="982" y="628" font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#0f766e">await rlm("review the API", name="api-reviewer")</text>

  <text x="982" y="662" font-size="15" font-weight="600" fill="#475569">持久化的 harness 状态</text>
  <text x="982" y="688" font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#0f766e">rlm.harness.create_memory(...) / create_skill(...) / …</text>

  <text x="982" y="722" font-size="15" font-weight="600" fill="#475569">跑 shell</text>
  <text x="982" y="748" font-size="14" font-family="Menlo, DejaVu Sans Mono, monospace" fill="#0f766e">%%bash 魔法命令(每个 cell 一个一次性子 shell)</text>

  <text x="982" y="782" font-size="15" fill="#0f766e">所有调用都是 Python 表达式,返回值可以直接接着用,不必经过上下文中转。</text>

  <rect x="962" y="822" width="766" height="100" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="982" y="852" font-size="16" font-weight="600" fill="#047857">能力的单位 = 一个 Python 包 + 一份 SKILL.md</text>
  <text x="982" y="882" font-size="15.5" fill="#475569">官方文档写得很直白:MCP 集成“不会”暴露成新的 agent 工具。</text>
  <text x="982" y="910" font-size="15.5" fill="#475569">接十个 MCP server,模型看到的工具数还是 1。</text>
</svg>
